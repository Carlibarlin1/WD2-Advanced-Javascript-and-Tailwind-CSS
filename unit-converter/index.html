<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metric Imperial Converter</title>

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-5">

            <h1 class="text-2xl md:text-3xl font-bold mb-4">
                Metric Imperial Converter
            </h1>

            <div class="flex flex-col sm:flex-row gap-2 sm:gap-4">

                <button 
                    id="weight-tab"
                    class="px-4 py-2 rounded font-semibold">
                    Weight
                </button>

                <button 
                    id="distance-tab"
                    class="px-4 py-2 rounded font-semibold">
                    Distance
                </button>

                <button 
                    id="temperature-tab"
                    class="px-4 py-2 rounded font-semibold">
                    Temperature
                </button>
            </div>

        </div>
    </nav>
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Weight Converter Section -->
         <section 
            id="weight-section" 
            class="bg-white rounded-lg shadow-md p-6 md:p-8">

            <h2 class="text-2xl font-bold mb-2">
                Weight Converter 
            </h2>

            <p class="text-gray-600 mb-6">
                Convert between pounds (lb) and kilograms (kg)
            </p>

            <form id="weight-form" class="space-y-4">

                <!-- Value Input -->
                 <div>
                    <label for="weight-input" class="block font-semibold mb-2">
                        Enter value or list of values
                    </label>

                    <input 
                    id="weight-input"
                    type="text"
                    placeholder="Example: 10 or 10, 20, 30"
                    class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                 </div>

                 <!-- Conversion Direction -->
                  <div>
                    <label for="weight-direction" class="block font-semibold mb-2">
                        Convert
                    </label>

                    <select
                    id="weight-direction"
                    class="w-full border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        <option value="lb-kg">
                            Pounds (lb) to Kilograms (kg)
                        </option>
                        <option value="kg-lb">
                            Kilograms (kg) to Pounds (lb)
                        </option>
                    </select>
                  </div>

                  <!-- Convert Button -->
                   <button
                    type="submit"
                    class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg"
                    >
                    Convert
                    </button>
            </form>

            <!-- Result -->
             <div class="mt-6 bg-gray-100 rounded-lg p-4">
                <h3 class="font-semibold text-gray-700">
                    Result:
                </h3>

                <p 
                    id="weight-result" 
                    class="mt-2 text-lg font-semibold text-blue-600">
                </p>
             </div>

         </section>

                        <!-- Distance Converter Section -->

        <section
            id="distance-section"
            class="hidden bg-white rounded-lg shadow-md p-6 md:p-8">

            <h2 class="text-2xl font-bold">
                Distance Converter
            </h2>

            <p class="text-gray-600 mb-6">
                Convert between miles (mi) and  Kilometres (km)
            </p>

                            <!-- Value input -->

            <form id="distance-form" class="space-y-4">
                <div>
                    <label for="distance-input" class="block font-semibold mb-2">
                        Enter value or list of values
                    </label>
                    <input
                        id="distance-input"
                        type="text"
                        placeholder="Example 10 or 10,20,30"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                </div>

                                <!-- Conversion Direction -->

                <div>
                    <label for="distance-direction" class="block font-semibold mb-2">
                        Convert
                    </label>

                    <select 
                    id="distance-direction"
                    class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                        <option value="mi-km">Miles (mi) to Kilometres (km)</option>

                        <option value="km-mi"> Kilometres (km) to Miles (mi)</option>

                    </select>

                </div>
                            <!-- Convert button -->
                <button 
                type="submit"
                class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg">
                    Convert
                </button>

            </form>

                            <!-- results -->

            <div class="mt-6 bg-gray-100 rounded-lg p-4">
                <h3 class="font-semibold text-gray-700">
                    Result:
                </h3>

                <p 
                    id="distance-result" 
                    class="mt-2 text-lg font-semibold text-blue-600">
                </p>
             </div>

        </section>


        <!-- Temperature Converter Section -->
        <section
            id="temperature-section"
            class="hidden bg-white rounded-lg shadow-md p-6 md:p-8">

            <h2 class="text-2xl font-bold mb-2">
                Temperature Converter
            </h2>

            <p class="text-gray-600 mb-6">
                Convert between Celsius (°C) and Fahrenheit (°F)
            </p>

            <form id="temperature-form" class="space-y-4">

                <div>
                    <label for="temperature-input" class="block font-semibold mb-2">
                        Enter value or list of values
                    </label>

                    <input
                    id="temperature-input"
                    type="text"
                    placeholder="Example: 20 or 0, 20, 37"
                    class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="temperature-direction" class="block font-semibold mb-2">
                        Convert
                    </label>

                    <select
                    id="temperature-direction"
                    class="w-full border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        <option value="c-f">
                            Celsius (°C) to Fahrenheit (°F)
                        </option>
                        <option value="f-c">
                            Fahrenheit (°F) to Celsius (°C)
                        </option>
                    </select>
                </div>

                <button
                type="submit"
                class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg"
                >
                Convert
                </button>
            </form>

            <div class="mt-6 bg-gray-100 rounded-lg p-4">
                <h3 class="font-semibold

                        <h3 class="font-semibold text-gray-700">
                    Result:
                </h3>

                <p
                    id="temperature-result"
                    class="mt-2 text-lg font-semibold text-blue-600">
                </p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
